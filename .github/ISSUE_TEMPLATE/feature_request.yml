name: Feature request
description: Suggest a new capability or workflow improvement.
title: "feat: "
labels: ["enhancement"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - CLI & installer
        - Subscription tiers & model routing
        - Quota, cooldowns & availability
        - Hooks & guardrails
        - "$auto-build skill workflow"
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Note that this project has zero dependencies and supports Node 18.18 or newer.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
