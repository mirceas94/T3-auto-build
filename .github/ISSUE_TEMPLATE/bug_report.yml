name: Bug report
description: Report something that does not work as documented.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not report vulnerabilities here. Use the private security advisory link instead.

        Redact tokens, keys, email addresses and user names in paths before you submit.
  - type: input
    id: version
    attributes:
      label: t3-auto-build version
      description: Output of `t3-auto-build --version` (from a clone, `node bin/cli.mjs --version`). If your version lacks the flag, copy `version` from `package.json`.
      placeholder: "3.0.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node version
      description: Output of `node --version`.
    validations:
      required: true
  - type: dropdown
    id: claude-tier
    attributes:
      label: Claude tier
      description: The value of `subscriptions.claude` in `auto-build.config.json`.
      options: [none, free, pro, max, ultra, team-standard, team-premium, api, not sure or v1 config]
    validations:
      required: true
  - type: dropdown
    id: codex-tier
    attributes:
      label: Codex tier
      description: The value of `subscriptions.codex`.
      options: [none, free, go, plus, pro-100, pro-200, pro-500, business, api, not sure or v1 config]
    validations:
      required: true
  - type: dropdown
    id: antigravity-tier
    attributes:
      label: Antigravity tier
      description: The value of `subscriptions.antigravity`.
      options: [none, free, plus, pro-trial, pro, ultra-5x, ultra-20x, not sure or v1 config]
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Exact commands or hook input.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Doctor output
      description: Output of `t3-auto-build doctor`. Redact paths and tokens.
      render: shell
  - type: textarea
    id: check-models
    attributes:
      label: Model availability
      description: Output of `t3-auto-build check-models --json`. If its cache is stale, this runs model probes, which spend quota. Redact paths and tokens.
      render: shell
  - type: textarea
    id: logs
    attributes:
      label: Other output
      description: Any other relevant output. Redact paths and tokens.
      render: shell
  - type: checkboxes
    id: redacted
    attributes:
      label: Redaction
      options:
        - label: I removed tokens, keys and personal paths from this report.
          required: true
