name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Verify release tag matches package.json
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node -e '
            const fs = require("node:fs");
            const { version } = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const expected = `v${version}`;
            if (process.env.RELEASE_TAG !== expected) {
              console.error(`Release tag ${process.env.RELEASE_TAG} does not match package.json ${expected}`);
              process.exit(1);
            }
            console.log(`Tag ${process.env.RELEASE_TAG} matches package.json ${version}`);
          '

      - name: Test
        run: node --test

      - name: Publish to npm
        run: npm publish --provenance --access public
