name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'release' || github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Verify release tag matches package.json
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node -e '
            const fs = require("node:fs");
            const { execFileSync } = require("node:child_process");
            const { version } = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const expected = `v${version}`;
            const fail = (message) => {
              console.error(message);
              process.exit(1);
            };
            const { EVENT_NAME, WORKFLOW_REF, RELEASE_TAG } = process.env;
            if (EVENT_NAME === "release") {
              if (RELEASE_TAG !== expected) fail(`Release tag ${RELEASE_TAG} does not match package.json ${expected}`);
            } else {
              if (WORKFLOW_REF !== "refs/heads/main") fail(`Manual publish must run on refs/heads/main, not ${WORKFLOW_REF}`);
              try {
                execFileSync("git", ["ls-remote", "--exit-code", "origin", "refs/tags/" + expected], { stdio: "inherit" });
              } catch (error) {
                fail(`Release tag ${expected} not verified on origin: ${error.message}`);
              }
            }
            console.log(`Tag ${expected} matches package.json ${version}`);
          '

      - name: Test
        run: node --test

      - name: Publish to npm
        run: npm publish --provenance --access public
